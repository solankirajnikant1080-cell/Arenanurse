<script>
'use strict';
const DATA=JSON.parse(document.getElementById('app-data').textContent),SUB=DATA.subjects,QUESTIONS=DATA.questions;
const TOPICS=SUB.flatMap(s=>s.topics.map(t=>({...t,subject:s.id}))),KEY='nursepath-gujarati-v1';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDay=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function addDays(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDay(d)}
const today=()=>localDay();
const defaults=()=>({version:1,topics:{},attempts:[],days:{},plan:{exam:addDays(today(),28),hours:3,start:today()},planDone:{}});
function cleanState(x){if(!x||x.version!==1||typeof x.topics!=='object'||!Array.isArray(x.attempts))throw Error('Invalid data');let s=defaults();const validDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v+'T12:00:00'));for(const t of TOPICS){let a=x.topics?.[t.id];if(a&&typeof a==='object')s.topics[t.id]={learned:validDate(a.learned)?a.learned:'',due:validDate(a.due)?a.due:'',reviews:Math.max(0,Math.min(999,Number(a.reviews)||0)),note:String(a.note||'').slice(0,10000)}}s.attempts=x.attempts.filter(a=>a&&QUESTIONS.some(q=>q.id===a.id)&&validDate(a.day)&&typeof a.correct==='boolean'&&Number.isInteger(a.selected)&&a.selected>=0&&a.selected<4).slice(-10000).map(a=>({id:a.id,correct:a.correct,selected:a.selected,day:a.day,confidence:['low','medium','high'].includes(a.confidence)?a.confidence:'medium'}));if(x.days&&typeof x.days==='object')for(const [k,v] of Object.entries(x.days)){if(validDate(k)&&Number.isFinite(v))s.days[k]=Math.max(0,Math.min(100000,v))}if(x.plan){s.plan.exam=validDate(x.plan.exam)?x.plan.exam:s.plan.exam;s.plan.start=validDate(x.plan.start)?x.plan.start:s.plan.start;s.plan.hours=Math.max(0.5,Math.min(12,Number(x.plan.hours)||3))}if(x.planDone&&typeof x.planDone==='object')for(const [k,v] of Object.entries(x.planDone)){if(validDate(k))s.planDone[k]=!!v}return s}
let state=defaults(),storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw)state=cleanState(JSON.parse(raw))}catch(e){storageOK=false}
let page='dashboard',filterSub='all',query='',topicFilter='all',revMode='due',quiz=null,quizTimer=null;
const names={banks:['▦','૨૦૦ MCQ • Topic banks','Topic question banks'],dashboard:['◫','अभ्यास ડૅશબોર્ડ','Overview'],library:['▤','વિષયો અને નોટ્સ','Topic library'],quiz:['✧','MCQ પ્રેક્ટિસ','Practice studio'],revision:['↻','Revision કેન્દ્ર','Revision centre'],plan:['▦','મારો અભ્યાસક્રમ','Study planner'],resources:['⌁','માર્ગદર્શિકા અને ડેટા','Resources & data']};
names.dashboard[1]='અભ્યાસ ડૅશબોર્ડ';
const sname=id=>SUB.find(s=>s.id===id)?.name||id;
const topicState=id=>state.topics[id]||{};
const learnedCount=()=>TOPICS.filter(t=>topicState(t.id).learned).length;
const dueTopics=()=>TOPICS.filter(t=>topicState(t.id).learned&&topicState(t.id).due&&topicState(t.id).due<=today());
const accuracy=arr=>arr.length?Math.round(arr.filter(a=>a.correct).length/arr.length*100):0;
function subjectStats(id){let qs=new Set(QUESTIONS.filter(q=>q.subject===id).map(q=>q.id)),a=state.attempts.filter(a=>qs.has(a.id));return {count:a.length,accuracy:accuracy(a)}}
function weakSubjects(){return SUB.map(s=>({...s,...subjectStats(s.id)})).filter(s=>s.count>=3&&s.accuracy<70).sort((a,b)=>a.accuracy-b.accuracy)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;toast('Browserમાં save શક્ય નથી. Backup export કરો.')}updateSave()}
function updateSave(){let el=document.getElementById('savestatus');if(el)el.textContent=storageOK?'આ ઉપકરણમાં auto-save':'Save ઉપલબ્ધ નથી · backup લો'}
function activity(){state.days[today()]=(state.days[today()]||0)+1}
function toast(msg){let t=document.getElementById('toasts');t.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>t.innerHTML='',3500)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function go(p){if(quiz&&quiz.finished){quiz=null;clearInterval(quizTimer)}if(quiz&&!quiz.finished&&p!=='quiz'){if(!confirm('ચાલુ quiz છોડશો? આપેલા જવાબો સેવ છે; session ફરી ચાલુ નહીં થાય.'))return;clearInterval(quizTimer);quiz=null}page=p;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.getElementById('nav').innerHTML=Object.entries(names).map(([p,a])=>`<button class="${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}')"><span aria-hidden="true">${a[0]}</span><span>${a[1]}</span></button>`).join('');document.getElementById('crumb').textContent=names[page][2];const f={dashboard:dashboard,library:library,quiz:quizPage,revision:revision,plan:planPage,resources:resources,banks:banksPage};document.getElementById('view').innerHTML=f[page]();updateSave()}
function heading(k,h,p,button=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${h}</h1><div class="muted small" style="margin-top:5px">${p}</div></div>${button}</div>`}
function foot(){return `<div class="footer"><span>NursePath · સ્વઅભ્યાસ માટેનું શૈક્ષણિક સાધન; clinical treatmentનો વિકલ્પ નથી.</span><span>${TOPICS.length} topics · ${QUESTIONS.length} મૂળ practice MCQ · v2.0 / Phase 1</span></div>`}
function subjectCard(s){let n=s.topics.filter(t=>topicState(t.id).learned).length,p=Math.round(n/s.topics.length*100),stat=subjectStats(s.id);return `<div class="subjectcard" role="button" tabindex="0" onclick="openSubject('${s.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSubject('${s.id}')}"><div class="subjecttop"><span class="subjecticon">${s.icon}</span><span class="badge ${p===100?'green':''}">${s.topics.length} topics</span></div><h3>${s.name}</h3><div class="muted tiny">${s.en}</div><div class="progress"><i style="width:${p}%"></i></div><div class="progressmeta"><span>${n}/${s.topics.length} અભ્યાસ કરેલા</span><span>${p}%</span></div>${stat.count?`<div class="tiny muted" style="margin-top:8px">MCQ: ${stat.accuracy}% · ${stat.count} attempts</div>`:''}</div>`}
function dashboard(){let n=learnedCount(),acc=accuracy(state.attempts),due=dueTopics(),weak=weakSubjects(),first=TOPICS.find(t=>!topicState(t.id).learned)||TOPICS[0];let days=Math.max(0,Math.ceil((new Date(state.plan.exam+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000));let dates=Array.from({length:7},(_,i)=>addDays(today(),i-6)),max=Math.max(1,...dates.map(d=>state.days[d]||0));return heading('YOUR LEARNING SPACE','ચાલો, તૈયારીને દિશા આપીએ.','સમજણથી શરૂઆત. પ્રેક્ટિસથી આત્મવિશ્વાસ.',`<button class="btn" onclick="exportData()">↓ ડેટા backup</button>`)+`<div class="hero"><div><small>GSSSB STAFF NURSE · ગુજરાતી STUDY COMPANION</small><h2>દરેક concept સાથે,<br>તમારા લક્ષ્યની વધુ નજીક.</h2><p>Infection Prevention & Control: 200 પ્રશ્નો તૈયાર. દરેક topicના 200 પ્રશ્નોનું લક્ષ્ય—બાકી banksની સ્થિતિ સ્પષ્ટ જુઓ.</p><button class="btn" onclick="openTopic('${first.id}')">આજનો અભ્યાસ શરૂ કરો <span>→</span></button></div><svg class="hero-art" viewBox="0 0 180 180" aria-hidden="true"><circle cx="90" cy="90" r="75" fill="#ffffff12"/><rect x="42" y="32" width="100" height="125" rx="12" fill="#fff" transform="rotate(9 90 90)"/><rect x="58" y="21" width="67" height="22" rx="8" fill="#d8caff"/><rect x="82" y="58" width="17" height="43" rx="3" fill="#8267de"/><rect x="69" y="71" width="43" height="17" rx="3" fill="#8267de"/><path d="M66 117h51M66 130h34" stroke="#e0daf4" stroke-width="7" stroke-linecap="round"/><circle cx="137" cy="135" r="26" fill="#b4e7cc"/><path d="m125 135 8 8 16-18" fill="none" stroke="#3a7f66" stroke-width="5" stroke-linecap="round"/></svg></div><div class="grid stats">${statCard('અભ્યાસ કરેલા topics',`${n}<span style="font-size:14px;color:var(--muted);font-weight:400"> / ${TOPICS.length}</span>`,'Self-marked completion','▤')}${statCard('MCQ ચોકસાઈ',state.attempts.length?`${acc}%`:'—',`${state.attempts.length} પ્રશ્નોના attempts`,'✧')}${statCard('આજનું revision',due.length,'Due topics ફરી યાદ કરો','↻')}${statCard('લક્ષ્ય સુધી દિવસ',days,`લક્ષ્ય: ${formatDate(state.plan.exam)}`,'▦')}</div><div class="card" style="margin-bottom:22px;border-color:#d6caef"><div class="sectionhead"><div><h2>એક topic. 200 અલગ MCQ.</h2><div class="small muted">Infection Prevention & Control · 20 subtopics · 10 practice sets</div></div><span class="badge green">1 / 108 READY</span></div><div class="btnrow"><button class="btn primary" onclick="setupTopicQuiz('fund-1')">200 પ્રશ્નોનો bank ખોલો →</button><button class="btn" onclick="go('banks')">બધા topicsની coverage જુઓ</button></div></div><div class="notice">ⓘ આ independent study app છે, official GSSSB app નથી. Syllabus checklist વ્યાપક છે, પરંતુ notification-verified નથી. 200 ગુણનું pattern પણ તમારી જાહેરાતની official PDFથી ચકાસો. Notes quick revision માટે અને MCQ મૂળ practice માટે છે; previous-year paper નથી.</div><div class="grid two"><section><div class="sectionhead"><h2>તમારા વિષયો</h2><button class="linkbtn" onclick="filterSub='all';go('library')">બધા topics જુઓ →</button></div><div class="subjectgrid">${SUB.slice(0,6).map(subjectCard).join('')}</div><div class="callout"><b>Foundation subjects પણ સાથે છે.</b><div class="muted" style="margin-top:5px">Pharmacology, Anatomy, Microbiology, Nutrition, ગુજરાતની યોજનાઓ અને ગુજરાતી—બધા Libraryમાં ઉપલબ્ધ છે.</div></div></section><aside class="grid" style="align-content:start"><div class="card"><div class="sectionhead"><h2>આગળનું નાનું પગલું</h2><span class="badge purple">TODAY</span></div>${due.length?`<div class="listitem"><div class="row"><span class="doticon">↻</span><div><b>${due.length} due topics</b><div class="muted tiny">યાદથી સમજાવો, પછી notes જુઓ</div></div></div></div><button class="linkbtn" onclick="go('revision')">Revision ખોલો →</button>`:`<div class="listitem"><div class="row"><span class="doticon">1</span><div><b>${esc(first.title)}</b><div class="muted tiny">${sname(first.subject)}</div></div></div></div><button class="linkbtn" onclick="openTopic('${first.id}')">Concept વાંચો →</button>`}<div class="listitem"><div class="row"><span class="doticon">✧</span><div><b>10 MCQનું diagnostic session</b><div class="muted tiny">મુશ્કેલથી સરળ · તરત reasoning</div></div></div></div><button class="btn primary" onclick="go('quiz')" style="width:100%;margin-top:13px">પ્રેક્ટિસ શરૂ કરો →</button></div><div class="card"><div class="sectionhead"><h2>ધ્યાન આપવાના વિષયો</h2><span class="badge">&lt;70%</span></div>${weak.length?weak.slice(0,3).map(s=>`<div class="listitem"><div><b>${s.name}</b><div class="tiny muted">${s.count} attempts · માત્ર પ્રાથમિક સંકેત</div></div><span class="badge amber">${s.accuracy}%</span></div>`).join(''):`<div class="muted small">દરેક વિષયના ઓછામાં ઓછા 3 જવાબ પછી સૂચન મળશે. થોડા પ્રશ્નોનો સ્કોર સંપૂર્ણ mastery બતાવતો નથી.</div>`}</div><div class="card"><h3>આ અઠવાડિયાની activity</h3><div class="tiny muted">Topics અને answered MCQની સંખ્યા</div><div class="week">${dates.map((d,i)=>`<div class="bar ${i===6?'today':''}" style="height:${Math.max(5,(state.days[d]||0)/max*100)}%" title="${d}: ${state.days[d]||0}"></div>`).join('')}</div><div class="weeklabels">${dates.map(d=>`<span>${d.slice(8)}</span>`).join('')}</div></div></aside></div>`+foot()}
function statCard(label,num,sub,icon){return `<div class="card stat"><div><label>${label}</label><div class="number">${num}</div><div class="tiny muted">${sub}</div></div><span class="stat-icon">${icon}</span></div>`}
function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString('gu-IN',{day:'numeric',month:'short',year:'numeric'})}
function openSubject(id){filterSub=id;query='';topicFilter='all';go('library')}
function openTopic(id){let t=TOPICS.find(x=>x.id===id);filterSub=t.subject;query='';topicFilter='all';go('library');let el=document.getElementById('topic-'+id);if(el){el.open=true;el.scrollIntoView({block:'start',behavior:'smooth'})}}
function library(){return heading('THE TOPIC LIBRARY','વિષય સમજો. જોડાણ શોધો.','વિસ્તૃત topic map + ટૂંકી concept notes. આ સંપૂર્ણ textbook અથવા live AI નથી.')+`<div class="search"><label class="visuallyhidden" for="topicsearch">Topics શોધો</label><input type="search" id="topicsearch" placeholder="Topic, technical term અથવા concept શોધો…" value="${esc(query)}" oninput="query=this.value;updateTopicResults()"><label class="visuallyhidden" for="subjectfilter">વિષય</label><select id="subjectfilter" onchange="filterSub=this.value;updateTopicResults()"><option value="all">બધા 12 વિષય</option>${SUB.map(s=>`<option value="${s.id}" ${filterSub===s.id?'selected':''}>${s.name}</option>`).join('')}</select><label class="visuallyhidden" for="topicfilter">સ્થિતિ</label><select id="topicfilter" onchange="topicFilter=this.value;updateTopicResults()"><option value="all" ${topicFilter==='all'?'selected':''}>બધા topics</option><option value="unread" ${topicFilter==='unread'?'selected':''}>અભ્યાસ બાકી</option><option value="read" ${topicFilter==='read'?'selected':''}>અભ્યાસ કરેલા</option><option value="high" ${topicFilter==='high'?'selected':''}>પહેલી પ્રાથમિકતા</option></select></div><div class="notice">★ “પહેલી પ્રાથમિકતા” appનું study suggestion છે; verified previous-year frequency કે official marks-weightage નથી. દરેક broad topicના chips તેની subtopic checklist દર્શાવે છે.</div><div id="topicresults">${topicResults()}</div>`+foot()}
function updateTopicResults(){document.getElementById('topicresults').innerHTML=topicResults()}
function topicResults(){let q=query.toLocaleLowerCase(),list=TOPICS.filter(t=>(filterSub==='all'||t.subject===filterSub)&&(!q||[t.title,t.focus,t.note,sname(t.subject),SUB.find(s=>s.id===t.subject).en].join(' ').toLocaleLowerCase().includes(q))&&(topicFilter!=='unread'||!topicState(t.id).learned)&&(topicFilter!=='read'||topicState(t.id).learned)&&(topicFilter!=='high'||t.priority==='high'));return `<div class="sectionhead"><span class="small muted">${list.length} topics · ${list.filter(t=>topicState(t.id).learned).length} અભ્યાસ કરેલા</span>${filterSub!=='all'?`<button class="btn soft" onclick="setupSubjectQuiz('${filterSub}')">આ વિષયના MCQ →</button>`:''}</div><div class="topiclist">${list.length?list.map(topicHTML).join(''):'<div class="card empty">આ શોધ માટે topic મળ્યો નથી. બીજો શબ્દ અથવા filter અજમાવો.</div>'}</div>`}

function revision(){let list=revMode==='all'?TOPICS.filter(t=>topicState(t.id).learned):dueTopics();return heading('SPACED REPETITION','યાદ રહે, એ રીતે revision.','Cycle: અભ્યાસ પછી દિવસ 1 → 3 → 7 → 14 → 28; પછી 30 દિવસે refresh.')+`<div class="pilltabs"><button class="${revMode==='due'?'active':''}" onclick="revMode='due';render()">આજે due (${dueTopics().length})</button><button class="${revMode==='all'?'active':''}" onclick="revMode='all';render()">બધા અભ્યાસ કરેલા (${learnedCount()})</button></div><div class="notice">પહેલાં notes જોયા વગર recall કરો. “ફરી revision થયું” માત્ર જવાબ સમજીને યાદ આવે ત્યારે દબાવો. ભૂલી ગયા હો તો “કાલે ફરી” કરો. Overdue revision પછી આગલી તારીખ ઓછામાં ઓછી આવતીકાલ રાખવામાં આવે છે.</div><div class="topiclist">${list.length?list.sort((a,b)=>topicState(a.id).due.localeCompare(topicState(b.id).due)).map(t=>`<div class="card"><div class="sectionhead"><div><h3>${esc(t.title)}</h3><span class="tiny muted">${sname(t.subject)} · Revision #${(topicState(t.id).reviews||0)+1} · ${formatDate(topicState(t.id).due)}</span></div><span class="badge ${topicState(t.id).due<=today()?'amber':'green'}">${topicState(t.id).due<=today()?'DUE':'UPCOMING'}</span></div><p class="small muted">${esc(t.focus)}</p><details><summary style="cursor:pointer;color:var(--purple);font-size:12px">યાદ કર્યા પછી concept જુઓ</summary><p class="small" style="margin-top:12px">${esc(t.note)}</p>${topicState(t.id).note?`<div class="callout"><b>મારી notes:</b><div style="white-space:pre-wrap">${esc(topicState(t.id).note)}</div></div>`:''}</details><div class="btnrow" style="margin-top:18px"><button class="btn primary" onclick="reviewDone('${t.id}',true)">✓ ફરી revision થયું</button><button class="btn" onclick="reviewDone('${t.id}',false)">કાલે ફરી ↻</button></div></div>`).join(''):`<div class="card empty"><h2>${learnedCount()?'આજે કોઈ revision due નથી.':'તમારી revision journey અહીં શરૂ થશે.'}</h2><p>Libraryમાં topic વાંચીને “અભ્યાસ થયો” કરો. આવતીકાલથી તે અહીં આવશે.</p><button class="b function reviewDone(id,ok){let st={...topicState(id)};if(!ok)st.due=addDays(today(),1);else{st.reviews=(st.reviews||0)+1;let cycle=[1,3,7,14,28];let next=st.reviews<cycle.length?addDays(st.learned,cycle[st.reviews]):addDays(today(),30);st.due=next<=today()?addDays(today(),1):next;activity()}state.topics[id]=st;save();render();toast(ok?'Revision નોંધાયું. આગલી તારીખ સેટ થઈ.':'કાલે ફરી પ્રયત્ન કરવા નોંધાયું.')}

function quizPage(){if(quiz)return quiz.finished?quizResult():quizRun();let weak=weakSubjects();return heading('PRACTICE STUDIO','૨૦૦ પ્રશ્નો. Topic પ્રમાણે પ્રેક્ટિસ.','દરેક જવાબ પછી explanation. મૂળ practice bank; previous-year questions નહીં.')+`<div class="quizbox"><div class="card"><div class="sectionhead"><h2>તમારું practice session</h2><span class="badge purple">${QUESTIONS.length} MCQ BANK</span></div><p class="small muted">Infection Prevention & Controlનો 200-MCQ topic bank તૈયાર છે. બીજા 107 topicsના 200-question banks હજી બાકી છે; જૂના 48 starter MCQ અલગથી ઉપલબ્ધ છે. Repeated attempts score prediction નથી.</p>${quizScopeHTML()}<div class="formgrid" style="margin:23px 0"><div class="field"><label for="qsubject">વિષય</label><select id="qsubject"><option value="all">Mixed — બધા વિષયો</option>${SUB.map(s=>`<option value="${s.id}" ${quizPreset===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="field"><label for="qcount">પ્રશ્નોની મહત્તમ સંખ્યા</label><select id="qcount"><option value="5">5 પ્રશ્ન</option><option value="10" selected>10 પ્રશ્ન</option><option value="20">20 પ્રશ્ન</option><option value="50">50 પ્રશ્ન</option><option value="100">100 પ્રશ્ન</option><option value="200">200 પ્રશ્ન</option><option value="${QUESTIONS.length}">સંપૂર્ણ ઉપલબ્ધ bank</option></select></div><div class="field"><label for="qorder">ક્રમ</label><select id="qorder"><option value="hard">મુશ્કેલ → મધ્યમ → સરળ</option><option value="random">Random order</option><option value="weak">મારી ભૂલો પહેલાં</option></select></div><div class="field"><label for="qnegative">Practice negative marking</label><select id="qnegative"><option value="0.25">ખોટો જવાબ: −0.25</option><option value="0">કોઈ negative marking નહીં</option></select></div></div><div class="notice" style="margin-bottom:20px">Marking અહીં practice setting છે. Official negative marking, unanswered/E-option rules અને pattern માટે તમારી જાહેરાત final છે. Skip માટે આ appમાં 0 ગુણ છે.</div><button class="b function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function originalStartQuiz(){let sid=document.getElementById('qsubject').value,n=+document.getElementById('qcount').value,order=document.getElementById('qorder').value,penalty=+document.getElementById('qnegative').value;let list=shuffle(QUESTIONS.filter(q=>sid==='all'||q.subject===sid).slice());if(order==='weak'){let last={};state.attempts.forEach(a=>last[a.id]=a);list.sort((a,b)=>(last[b.id]?.correct===false?1:0)-(last[a.id]?.correct===false?1:0)||b.difficulty-a.difficulty)}list=list.slice(0,n);if(order==='hard')list.sort((a,b)=>b.difficulty-a.difficulty);quiz={list,index:0,answers:[],penalty,started:Date.now(),finished:false};quizPreset='all';render();clearInterval(quizTimer);quizTimer=setInterval(()=>{let e=document.getElementById('quiztime');if(e)e.textContent=elapsed()},1000)}

function answerQuiz(choice){if(!quiz||quiz.finished||quiz.answers[quiz.index]!==undefined)return;let q=quiz.list[quiz.index],confidence=document.getElementById('confidence')?.value||'medium';quiz.answers[quiz.index]={id:q.id,choice,confidence};if(choice>=0){state.attempts.push({id:q.id,correct:choice===q.answer,selected:choice,confidence,day:today()});state.attempts=state.attempts.slice(-10000);activity();save()}render()}

/div>`+foot()}
function buildSchedule(){
 let total=Math.ceil((new Date(state.plan.exam+'T12:00:00')-new Date(state.plan.start+'T12:00:00'))/86400000),days=Math.max(1,Math.min(180,total));
 let weak=weakSubjects().filter(s=>s.id!=='gujarati'),order=[...weak.map(s=>s.id),...SUB.filter(s=>s.id!=='gujarati'&&!weak.some(w=>w.id===s.id)).map(s=>s.id)];
 let slots=Array.from({length:days},(_,i)=>i).filter(i=>(i+1)%7!==0&&i/days<.86);if(!slots.length)slots=[0];
 let ordered=order.flatMap(id=>TOPICS.filter(t=>t.subject===id)),schedule={},langs=SUB.find(s=>s.id==='gujarati').topics;
 slots.forEach((day,i)=>schedule[day]=ordered.slice(Math.floor(i*ordered.length/slots.length),Math.floor((i+1)*ordered.length/slots.length)));

}
